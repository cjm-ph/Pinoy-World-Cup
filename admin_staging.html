<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staging photo manager &larr; Pinoy World Cup</title><style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{padding:22px max(20px,calc((100vw - 1040px)/2));border-bottom:1px solid #29334e}a{color:#a6c4ff}main{max-width:1040px;margin:auto;padding:32px 20px}.intro{text-align:center}h1,h2{line-height:1.2}.card{background:#151d32;border:1px solid #303e5e;border-radius:20px;padding:28px;box-shadow:0 16px 48px #0004}#stagingLogin{max-width:440px;margin:48px auto}label{display:block;margin:16px 0 6px}input:not([type=checkbox]),select,textarea{display:block;width:100%;padding:12px;border:1px solid #52617e;border-radius:10px;background:#0b1225;color:inherit;font:inherit}input[type=checkbox]{width:20px;height:20px;vertical-align:middle}textarea{min-height:100px}button{padding:12px 18px;margin:10px 8px 4px 0;background:#285cc4;color:white;border:1px solid #6c96ed;border-radius:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f4cf5c;outline-offset:3px}#stagingLogin button{width:100%}#stagingStatus{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.toolbar a{margin-right:auto}#stagingManagement{margin-top:24px}details{margin-top:24px}@media(max-width:600px){main{padding:20px 14px}.card{padding:20px}#stagingLogin{margin:28px auto}#stagingManagement button{width:100%}h1{font-size:1.7rem}}
</style></head><body><header><a href="/">&larr; Pinoy World Cup</a></header><main id="stagingAdmin"><div class="intro"><h1>Staging photo manager</h1><p>Manage photos and publications with your authorized Staging account.</p></div><section class="card" id="stagingLogin" aria-label="Administrator sign in"><h2>Administrator sign in</h2><label>Email <input id="stagingEmail" type="email" autocomplete="username"></label>
<label>Password <input id="stagingPassword" type="password" autocomplete="current-password"></label>
<button id="stagingSignIn">Sign in</button>

</section><p id="stagingStatus" role="status" aria-live="polite">Sign in to continue.</p><div class="toolbar"><a href="/">Open public World Cups</a><button id="stagingRefresh">Check access</button><button id="stagingSignOut" hidden>Sign out</button></div><section class="card" id="stagingManagement" hidden aria-label="Photo management"><h2>Photos and publication</h2><label>Tournament <select id="stagingTournament"></select></label><p id="stagingRevision"></p><p id="stagingReadiness" role="status"></p>
<label>Photo slot <select id="stagingSlot"></select></label>
<label>New photo <input id="stagingFile" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="stagingUpload">Upload new photo</button>
<label><input id="stagingRightsAck" type="checkbox">I have verified permission to use this photo.</label>
<label>Rights evidence <textarea id="stagingEvidence" placeholder="Source, license or permission details"></textarea></label><button id="stagingRights">Record usage rights</button>
<button id="stagingReplace">Create replacement draft</button>
<label><input id="stagingSubmitAck" type="checkbox">This draft is complete and ready for independent review.</label><button id="stagingSubmit">Submit for review</button>
<button id="stagingApprove">Approve as separate reviewer</button><button id="stagingPublish">Publish approved revision</button>
<label>Previous approved revision <select id="stagingRollback"></select></label><button id="stagingRestore">Restore selected publication</button>
<details><summary>Previous publication reference</summary><pre id="stagingHistory"></pre></details>
</section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/staging-media-config.js"></script><script type="module" src="scripts/staging-media-ui.mjs"></script></body></html>
